name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
      - 'v*.*.*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      release_title:
        description: 'Release Title (e.g. ExtremeBooster v1.0.0)'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: 🚀 Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17 (Stable LTS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🔐 Prepare Environment & Keystore
        run: |
          echo "Preparing build configuration..."
          # Create .env from template if missing
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

          # Restore debug.keystore if base64 encoded version exists
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: 🔧 Make Gradle Executable
        run: chmod +x ./gradlew

      - name: 🔨 Compile APK with Gradle
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'debug' }}"
          echo "Selected Build Type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "release" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ]; then
            echo "Running release build with configured signing keys..."
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            echo "Running debug build..."
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: 📦 Locate and Package APK Assets
        id: prepare_artifacts
        run: |
          mkdir -p release_assets
          # Locate built APKs
          APK_FILES=$(find app/build/outputs/apk/ -type f -name "*.apk")
          echo "Found APK files: $APK_FILES"

          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No APK files found in app/build/outputs/apk/!"
            exit 1
          fi

          VERSION_TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_TAG="manual-${{ github.run_number }}"
          fi

          for apk in $APK_FILES; do
            FILENAME=$(basename "$apk")
            DEST_NAME="ExtremeBooster-${VERSION_TAG}-${FILENAME}"
            cp "$apk" "release_assets/${DEST_NAME}"
            echo "Prepared asset: release_assets/${DEST_NAME}"
            
            # Compute SHA256 checksum
            sha256sum "$apk" | awk '{print $1}' > "release_assets/${DEST_NAME}.sha256"
          done

          ls -la release_assets/

      - name: 📤 Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeBooster-APK-${{ github.ref_name }}
          path: release_assets/*
          retention-days: 30

      - name: 🏷️ Determine Release Tag Name
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0-build.${{ github.run_number }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: 🚀 Publish GitHub Release (Native GitHub CLI)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          TITLE="${{ github.event.inputs.release_title != '' && github.event.inputs.release_title || steps.release_tag.outputs.tag }}"
          
          echo "Publishing GitHub Release for tag: $TAG"
          
          # Use GitHub's official pre-installed CLI - zero Docker, 100% reliable
          gh release create "$TAG" release_assets/* \
            --title "$TITLE" \
            --generate-notes || \
          gh release upload "$TAG" release_assets/* --clobber
